name: 2046 Architecture Compatibility
on:
  push:
    paths:
      - 'metadata/**'
      - 'examples/policy_wallet/**'
      - 'examples/agent_economy/**'
      - 'e2e/**'
  pull_request:
    paths:
      - 'metadata/**'
      - 'examples/policy_wallet/**'
      - 'examples/agent_economy/**'

jobs:
  metadata-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run metadata tests
        run: go test ./metadata/... -v
      - name: Run e2e tests
        run: go test ./e2e/... -v
      - name: Verify compatibility matrix
        run: |
          go test -run TestCompatibilityMatrix ./e2e/... -v
      - name: Compile all example contracts
        run: |
          for f in examples/policy_wallet/*.tol examples/agent_economy/*.tol; do
            echo "Compiling $f..."
            go run cmd/tolang/main.go compile "$f" || exit 1
          done
          echo "All contracts compiled successfully"
